name: Windows build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 release
        shell: cmd
        run: build.bat
      - name: Capture and output regressions (synthetic pixels only)
        shell: cmd
        run: tests\run_capture_output_tests.bat
      - name: Capture completion ordering and worker lifetime
        shell: cmd
        run: tests\run_capture_pipeline_tests.bat
      - name: Automatic JPEG threshold and exact output
        shell: cmd
        run: tests\run_png_threshold_tests.bat
      - name: Alpha predicate boundaries and exact results
        shell: cmd
        run: tests\run_pixel_alpha_tests.bat
      - name: Lossless PNG pixels, metadata and runtime dispatch
        shell: cmd
        run: tools\perf\image_fpng_quality.bat
      - name: Lossless PNG scalar fallback
        shell: cmd
        run: tools\perf\image_fpng_quality.bat --scalar
      - name: Image core regressions
        shell: cmd
        run: tools\test_image_core.bat
      - name: Gallery search and sorting
        shell: cmd
        run: tests\run_gallery_model_tests.bat
      - name: Clipboard shelf with synthetic clipboard data
        shell: cmd
        run: tests\run_clipboard_shelf_tests.bat
      - name: Hidden gallery window and input routing
        shell: cmd
        run: tests\run_mainwindow_gallery_tests.bat
      - name: Continuous brush strokes and explicit selection
        shell: cmd
        run: tests\run_editor_brush_tests.bat
      - name: Exact blur and editor export
        shell: cmd
        run: tests\run_editor_fx_tests.bat
      - name: Cursor camera motion model
        shell: cmd
        run: tests\run_cursor_follow_tests.bat
      - name: Recorder cursor state and output routing
        shell: cmd
        run: tests\run_recorder_cursor_tests.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Zipshot-windows-x64
          path: |
            build/zipshot.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
