name: Build & Release Zipshot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.1). Leave empty to read from src/updater.h.'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub Release (creates tag v<version> if needed)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and sync version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ''
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -match '^v(.+)$') {
            $version = $Matches[1]
          } elseif ('${{ inputs.version }}' -ne '') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V').Trim()
          } else {
            $src = Get-Content -Raw src/updater.h
            if ($src -match 'kAppVersion\s*=\s*L"([^"]+)"') {
              $version = $Matches[1]
            }
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to determine release version.' }
          $tag = "v$version"
          Write-Host "Resolved version=$version tag=$tag"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Sync src/updater.h
          $uPath = 'src/updater.h'
          $uSrc = Get-Content -Raw $uPath
          $uNew = [regex]::Replace($uSrc, 'kAppVersion\s*=\s*L"[^"]+"', "kAppVersion = L`"$version`"")
          if ($uNew -ne $uSrc) { Set-Content -Path $uPath -Value $uNew -NoNewline }

          # Sync res/zipshot.rc
          $parts = ($version -split '-')[0] -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          $rcComma = ($parts[0..3] -join ',')
          $rcDot = ($parts[0..3] -join '.')
          $rcPath = 'res/zipshot.rc'
          $rcSrc = Get-Content -Raw $rcPath
          $rcNew = $rcSrc -replace 'FILEVERSION\s+[0-9,]+', "FILEVERSION $rcComma" `
                          -replace 'PRODUCTVERSION\s+[0-9,]+', "PRODUCTVERSION $rcComma" `
                          -replace '"FileVersion",\s*"[^"]+"', "`"FileVersion`", `"$rcDot`"" `
                          -replace '"ProductVersion",\s*"[^"]+"', "`"ProductVersion`", `"$rcDot`""
          if ($rcNew -ne $rcSrc) { Set-Content -Path $rcPath -Value $rcNew -NoNewline }

      - name: Build x64 release
        shell: cmd
        run: build.bat

      - name: Run regression tests
        shell: cmd
        run: |
          tests\run_capture_output_tests.bat || exit /b 1
          tests\run_capture_pipeline_tests.bat || exit /b 1
          tests\run_png_threshold_tests.bat || exit /b 1
          tests\run_pixel_alpha_tests.bat || exit /b 1
          tests\run_gallery_model_tests.bat || exit /b 1
          tests\run_clipboard_shelf_tests.bat || exit /b 1
          tests\run_mainwindow_gallery_tests.bat || exit /b 1
          tests\run_editor_brush_tests.bat || exit /b 1
          tests\run_editor_fx_tests.bat || exit /b 1
          tests\run_cursor_follow_tests.bat || exit /b 1
          tests\run_recorder_cursor_tests.bat || exit /b 1
          tests\run_updater_tests.bat || exit /b 1
          tools\test_image_core.bat || exit /b 1

      - name: Package release assets & SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force dist/release, dist/stage | Out-Null
          Copy-Item build/zipshot.exe dist/stage/zipshot.exe -Force
          Copy-Item LICENSE dist/stage/LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist/stage/THIRD_PARTY_NOTICES.md -Force

          # Direct zipshot.exe asset for instant <1s self-updates + Portable ZIP for manual downloads
          Copy-Item build/zipshot.exe dist/release/zipshot.exe -Force
          $zipPath = "dist/release/Zipshot-$ver-Portable-win-x64.zip"
          Compress-Archive -Path dist/stage/* -DestinationPath $zipPath -Force

          $files = Get-ChildItem -Path dist/release -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$h  $($f.Name)"
          }
          Set-Content -Path dist/release/SHA256SUMS.txt -Value $lines
          Get-Content dist/release/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zipshot-${{ steps.ver.outputs.version }}-win-x64
          path: dist/release/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Zipshot ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/release/zipshot.exe
            dist/release/Zipshot-${{ steps.ver.outputs.version }}-Portable-win-x64.zip
            dist/release/SHA256SUMS.txt
